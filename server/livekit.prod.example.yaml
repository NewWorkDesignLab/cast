# LiveKit on server.nwdl.org. Copy to ~/apps/cast/livekit.yaml (chmod 600) and fill in the keys from Vercel.
# Signalling: 127.0.0.1:7880 behind Apache/KeyHelp as live.nwdl.org (Cloudflare proxy on).
# Media: directly on the server's public IP; turn.nwdl.org must be "DNS only".
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  ips:
    excludes:
      - 172.16.0.0/12 # Docker networks of the other apps on this host
turn:
  enabled: true
  domain: turn.nwdl.org
  udp_port: 3478 # TURN over TLS would need port 443, which Apache uses
  relay_range_start: 40000
  relay_range_end: 40999
keys:
  LIVEKIT_API_KEY: LIVEKIT_API_SECRET
logging:
  level: info
