# KeyHelp: domain live.nwdl.org -> individual HTTPS configuration (same pattern as vault.nwdl.org).
# LiveKit signalling (WebSocket and server API) on 127.0.0.1:7880, only reachable through Cloudflare.
ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 120

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

<Location "/">
    Require ip 127.0.0.1
    Require ip ::1
    IncludeOptional /etc/apache2/keyhelp/cloudflare-ips.conf
</Location>

# Keeps the Let's Encrypt challenge with KeyHelp, otherwise the certificate cannot be renewed
ProxyPass /.well-known/acme-challenge !
ProxyPass / http://127.0.0.1:7880/ upgrade=websocket
ProxyPassReverse / http://127.0.0.1:7880/
